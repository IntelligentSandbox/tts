<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>tts panel</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <h1>TTS Panel</h1>
  <div id="auth">
    <button id="login_oauth" data-action="login-oauth">login w/ oauth</button>
    <button id="logout" data-action="logout">logout</button>
    <small id="auth_status">not logged in</small>
  </div>

  <div id="workspace">
    <div id="compose">
      <div id="row">
        <label for="voices">voice/alias</label>
        <select id="voices"></select>
        <button id="refresh" data-action="refresh">refresh</button>
        <div id="toggles">
          <label><input type="checkbox" id="autoplay" data-action="toggle-autoplay" /> autoplay</label>
          <label><input type="checkbox" id="pollq" data-action="toggle-poll" /> queue poll (live)</label>
        </div>
      </div>

      <form id="form">
        <label for="tts">message</label>
        <textarea id="tts" rows="5" cols="90" placeholder="brian: hello or [fast] hello or {boom} hello"></textarea>
        <div>
          <button id="submit" data-action="submit-text" type="button" disabled>add</button>
        </div>
      </form>

      <audio id="player" controls></audio>

      <table aria-label="tts messages">
        <thead>
          <tr>
            <th style="width: 6rem">time</th>
            <th>text</th>
            <th style="width: 12rem">voice/preset</th>
            <th style="width: 7rem">status</th>
            <th style="width: 10rem">actions</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

    <aside id="panels">
      <details open id="tuning">
        <summary>tuning</summary>
        <div class="section">
          <label for="preset">preset</label>
          <select id="preset">
            <option value="">(none)</option>
          </select>
          <label for="length_scale">length_scale</label>
          <input id="length_scale" type="number" step="0.01" min="0.5" max="2" placeholder="auto" />
        </div>
      </details>

      <details open id="catalog_admin">
        <summary>aliases and profiles (admin)</summary>

        <div class="section">
          <span class="badge">voice alias</span>
          <input id="alias_name" placeholder="alias name (e.g. brian)" />
          <select id="alias_target"></select>
          <button id="alias_add" data-action="alias-add">add</button>
          <div id="aliaslist"></div>
        </div>

        <div class="section">
          <span class="badge">profile</span>
          <input id="profile_name" placeholder="profile name (e.g. narrator)" />
          <select id="profile_target"></select>
          <input id="profile_fx" placeholder="fx chain (optional)" />
          <button id="profile_add" data-action="profile-add">add</button>
        </div>

        <div class="section">
          <span class="badge">sound alias</span>
          <input id="sfx_name" placeholder="alias name (e.g. drum)" />
          <select id="sfx_target"></select>
          <button id="sfx_add" data-action="sfx-add">add</button>
          <div id="sfxlist"></div>
        </div>
      </details>

      <details id="mod_panel">
        <summary>moderation (mod)</summary>
        <div class="section">
          <label><input type="checkbox" id="censor_on" data-action="censor-toggle" checked /> on</label>
          <label for="censor_mode">level</label>
          <select id="censor_mode" data-action="censor-mode"></select>
          <input id="block_term" placeholder="blocked term" />
          <button id="block_add" data-action="block-add">block</button>
          <button id="block_reload" data-action="block-reload" title="reread the blocklist file">reload</button>
          <span id="block_count"></span>
          <button id="block_reveal" data-action="block-reveal">show</button>
          <div id="blocklist"></div>
        </div>
      </details>

      <details id="token_admin">
        <summary>overlay embeds (admin)</summary>
        <div class="section">
          <label for="token_ttl">ttl (0 never expires)</label>
          <input id="token_ttl" type="number" min="0" value="3600" title="seconds, 0 never expires" />
          <input id="token_origin" type="text" placeholder="optional origin (https://example.com)" />
          <button id="mint_token" data-action="mint-token">create embed</button>
          <div id="mint_result"></div>
        </div>
      </details>

      <details id="oauth_admin">
        <summary>access (admin)</summary>
        <div class="section">
          <label>provider</label>
          <select id="map_provider">
            <option value="twitch">twitch</option>
          </select>
          <label>id</label>
          <input id="map_remote" placeholder="twitch id or login" />
          <label>role</label>
          <select id="map_role">
            <option value="admin">admin</option>
            <option value="mod">mod</option>
          </select>
          <button id="map_add" data-action="map-add">add mapping</button>
          <div id="maplist"></div>
        </div>
      </details>
    </aside>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
