[project]
name = "tts"
version = "0.1"
description = "TTS service - Voice generation with Piper and Kokoro backends"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0.0",
    "itsdangerous>=2.2.0",
    "piper-tts>=1.2.0",
    "pyjwt>=2.9.0",
    "cachetools>=5.5.0",
    "kokoro>=0.9.4",
    "soundfile>=0.13.0",
    "pedalboard>=0.9.22,<0.9.24",
    "echo-common",
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "emoji>=2.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
echo-common = { workspace = true }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "RUF", "PIE", "TRY", "PERF", "PLR2004"]
ignore = ["RUF001", "RUF010", "TRY003", "TRY300", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "RUF012", "PLR2004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["."]
ignore_missing_imports = true
implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tts-venv/"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
